<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>WeatherNow — Professional Real-Time Weather Forecast</title>
    <meta
      name="description"
      content="Get precision real-time weather forecasts, hourly timelines, 7-day outlooks, Weather DNA, comfort scores, and outdoor activity recommendations."
    />
    <meta name="keywords" content="weather, real-time forecast, hourly weather, 7-day forecast, weather DNA, comfort score, rain window, weather radar" />
    <meta name="author" content="WeatherNow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://weather-realtime-website.vercel.app/" />
    <meta property="og:title" content="WeatherNow — Professional Real-Time Weather Forecast" />
    <meta property="og:description" content="Precision real-time weather forecasts, hourly timelines, 7-day outlooks, Weather DNA, and activity recommendations." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WeatherNow — Professional Real-Time Weather Forecast" />
    <meta name="twitter:description" content="Precision real-time weather forecasts, hourly timelines, 7-day outlooks, Weather DNA, and activity recommendations." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Progressive Web App -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WeatherNow" />

    <!-- Preconnect for fast fonts and APIs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "WeatherNow",
        "applicationCategory": "WeatherApplication",
        "operatingSystem": "All",
        "description": "Professional real-time weather forecast application with Weather DNA, hourly timeline, 7-day outlook, and outdoor activity recommendations.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run WeatherNow.</noscript>
    <div id="root"></div>
  </body>
</html>
