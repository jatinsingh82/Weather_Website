<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06090e" />
    <title>WeatherNow — Professional Real-Time Weather</title>
    <meta
      name="description"
      content="A modern, high-precision weather forecast application with Weather DNA, hourly timeline, 7-day outlook, smart search, and activity advice."
    />
    <meta
      name="keywords"
      content="WeatherNow, Weather Forecast, Real-Time Weather, Weather DNA, Hourly Weather, Rain Radar, Comfort Score, Activity Advisor, Weather Intelligence"
    />
    <meta name="author" content="WeatherNow" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://weather-website-ten-phi.vercel.app/" />
    <meta property="og:title" content="WeatherNow — Professional Real-Time Weather" />
    <meta
      property="og:description"
      content="A modern, high-precision weather forecast application with Weather DNA, hourly timeline, 7-day outlook, smart search, and activity advice."
    />
    <meta property="og:site_name" content="WeatherNow" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WeatherNow — Professional Real-Time Weather" />
    <meta
      name="twitter:description"
      content="A modern, high-precision weather forecast application with Weather DNA, hourly timeline, 7-day outlook, smart search, and activity advice."
    />

    <!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Structured Data for Weather Web Application -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "WeatherNow",
        "applicationCategory": "WeatherApplication",
        "operatingSystem": "All",
        "description": "A modern, high-precision weather forecast application with Weather DNA, hourly timeline, 7-day outlook, smart search, and activity advice.",
        "offers": {
          "@type": "Offer",
          "price": "0"
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run WeatherNow.</noscript>
    <div id="root"></div>
  </body>
</html>
